plugins {
	id 'java'
}

group = 'com.pkoka5'
version = '0.7.1'

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.pkoka5.ironmanbankarchitect.IronmanBankArchitectPluginTest'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

processResources {
	from('runelite-plugin.properties')
}

tasks.register('run', JavaExec) {
	group = 'RuneLite'
	description = 'Starts a local RuneLite client for plugin development.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	enableAssertions = true
	args '--developer-mode'
	if (System.getProperty('os.name').toLowerCase().contains('mac'))
	{
		jvmArgs '--add-exports', 'java.desktop/com.apple.eawt=ALL-UNNAMED'
	}
}

tasks.register('exportEffectiveItemClassifications', JavaExec) {
	group = 'verification'
	description = 'Exports the effective Ironman item classification for offline research.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.pkoka5.ironmanbankarchitect.research.EffectiveItemClassificationExporter'
	args(
		project.findProperty('auditRegistry') ?: 'src/main/resources/com/pkoka5/ironmanbankarchitect/catalog/item-registry.tsv',
		project.findProperty('auditOutput') ?: 'tools/research/item-classification-audit/cache/effective-item-classifications.tsv',
		project.findProperty('auditExcludedOutput') ?: 'tools/research/item-classification-audit/cache/excluded-cache-records.tsv'
	)
}

tasks.register('simulateRandomBanks', JavaExec) {
	group = 'verification'
	description = 'Simulates random banks against the tab guidance route and reports outcomes.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.pkoka5.ironmanbankarchitect.simulate.RandomBankSimulationRunner'
	args(
		project.findProperty('simBanks') ?: '50',
		project.findProperty('simSeed') ?: '20260718',
		project.findProperty('simMinItems') ?: '6',
		project.findProperty('simMaxItems') ?: '120',
		project.findProperty('simOutput') ?: 'build/reports/bank-simulation/report.tsv'
	)
}

tasks.register('aggregateCleanupReview', JavaExec) {
	group = 'verification'
	description = 'Runs the fixed multi-seed cleanup-review benchmark and writes aggregate reports.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.pkoka5.ironmanbankarchitect.simulate.AggregateCleanupReviewRunner'
	args(
		project.findProperty('aggregateOutput') ?: 'build/reports/bank-simulation/aggregate'
	)
}

tasks.register('verifySimulationBaselines') {
	group = 'verification'
	description = 'Refuses unreviewed changes to the four fixed-seed simulation reports.'
	dependsOn tasks.named('simulateRandomBanks'), tasks.named('aggregateCleanupReview')
	doLast {
		// Reviewed against upstream 3cd6173: 29 scenario metrics changed; cleanup
		// changes match exact-ID semantic corrections (21 exits, Red hot sauce added).
		def expected = [
			'report.tsv': 'dd59e0d3fdd12e374798a3b3e7dfcec0bb78d3ea53f3a3fdd5c307808ab72260',
			'cleanup-review.tsv': 'e0d61d5f485218b9ac9294a18a4069649570fca2b2efd59b7b89a83ba0c703fa',
			'aggregate/cleanup-review.tsv': '9d56a38d5d9c30bce36eb94d4882c05054024647081e1e67834174bf34150962',
			'aggregate/metadata.tsv': '0850e7ad92f6f0ca8f194daa70a65d97425568b6eff98de79216dfcdb6688155'
		]
		def customParameters = ['simBanks', 'simSeed', 'simMinItems', 'simMaxItems', 'simOutput', 'aggregateOutput']
		if (customParameters.any { project.hasProperty(it) }) {
			throw new GradleException('Baseline verification requires default simulation parameters; run custom simulations separately.')
		}
		expected.each { name, hash ->
			def report = file("build/reports/bank-simulation/${name}")
			if (!report.isFile()) throw new GradleException("Missing baseline report: ${name}")
			// The reference checkout is CRLF. Canonicalize only line endings for other OSes.
			def bytes = report.getText('UTF-8').replace('\r\n', '\n').replace('\n', '\r\n').getBytes('UTF-8')
			def actual = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
			if (actual != hash) {
				throw new GradleException("Simulation baseline changed: ${name}\nExpected: ${hash}\nActual:   ${actual}\nReview the behavior change; do not regenerate the baseline automatically.")
			}
			logger.lifecycle("Baseline OK: ${name}")
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifySimulationBaselines')
}

tasks.register('generateRealBankFixture', JavaExec) {
	group = 'verification'
	description = 'Deliberately regenerates the ID-only real-bank routing regression fixture.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.pkoka5.ironmanbankarchitect.organize.RealBankFixtureGenerator'
	args(
		project.findProperty('realBankExport') ?: 'tmp/bank-export-2026-07-19.txt',
		project.findProperty('realBankFixture') ?:
			'src/test/resources/com/pkoka5/ironmanbankarchitect/organize/real-bank-fixture-2026-07-19.tsv'
	)
}

wrapper {
	gradleVersion = '8.7'
	distributionType = Wrapper.DistributionType.BIN
}
